version: '3.8'

services:
  bug-feed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bug-feed
    restart: unless-stopped
    ports:
      - "${PORT:-9600}:9600"
    environment:
      - PORT=9600
      - HOST=0.0.0.0
      - NODE_ENV=production
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-15}
      - AUTH_SECRET=${AUTH_SECRET:-}
    volumes:
      - bugfeed_data:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9600/api/auth/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  bugfeed_data:
    driver: local
